name: Build HopeTDL

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            build_cmd: pnpm run build && CSC_IDENTITY_AUTO_DISCOVERY=false pnpm exec electron-builder --mac --publish never
            artifact_name: HopeTDL-macOS
            artifact_path: |
              release/*.dmg
              release/*-mac.zip

          - name: Windows x64
            os: windows-latest
            build_cmd: pnpm run build && pnpm exec electron-builder --win --publish never
            artifact_name: HopeTDL-Windows
            artifact_path: |
              release/*.exe
              release/*.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Workflow marker
        run: |
          echo "HopeTDL workflow pnpm-v2: no npm install, no verify-local-build-tools"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
          run_install: false

      - name: Show tool versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false

      - name: Fix Windows icon
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pngPath = Join-Path $PWD 'assets/icons/icon-256.png'
          $icoPath = Join-Path $PWD 'assets/icons/icon.ico'
          if (!(Test-Path $pngPath)) {
            $pngPath = Join-Path $PWD 'assets/icons/icon.png'
          }
          if (!(Test-Path $pngPath)) {
            throw "Cannot find icon PNG at assets/icons/icon-256.png or assets/icons/icon.png"
          }
          Add-Type -AssemblyName System.Drawing
          $pngBytes = [System.IO.File]::ReadAllBytes($pngPath)
          $image = [System.Drawing.Image]::FromFile($pngPath)
          if ($image.Width -lt 256 -or $image.Height -lt 256) {
            throw "Windows icon source must be at least 256x256 pixels, got $($image.Width)x$($image.Height)"
          }
          $image.Dispose()
          $fs = [System.IO.File]::Create($icoPath)
          $bw = New-Object System.IO.BinaryWriter($fs)
          $bw.Write([UInt16]0)
          $bw.Write([UInt16]1)
          $bw.Write([UInt16]1)
          $bw.Write([Byte]0)
          $bw.Write([Byte]0)
          $bw.Write([Byte]0)
          $bw.Write([Byte]0)
          $bw.Write([UInt16]1)
          $bw.Write([UInt16]32)
          $bw.Write([UInt32]$pngBytes.Length)
          $bw.Write([UInt32]22)
          $bw.Write($pngBytes)
          $bw.Close()
          $fs.Close()
          Write-Host "Generated Windows icon: $icoPath from $pngPath"

      - name: Build app
        shell: bash
        run: ${{ matrix.build_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
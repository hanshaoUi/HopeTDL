name: Build HopeTDL

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            build_cmd: pnpm run build && CSC_IDENTITY_AUTO_DISCOVERY=false pnpm exec electron-builder --mac
            artifact_name: HopeTDL-macOS
            artifact_path: |
              release/*.dmg
              release/*-mac.zip

          - name: Windows x64
            os: windows-latest
            build_cmd: pnpm run build && pnpm exec electron-builder --win
            artifact_name: HopeTDL-Windows
            artifact_path: |
              release/*.exe
              release/*.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Workflow marker
        run: echo "HopeTDL workflow pnpm-v2: no npm install, no verify-local-build-tools"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
          run_install: false

      - name: Show tool versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false

      - name: Build app
        shell: bash
        run: ${{ matrix.build_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
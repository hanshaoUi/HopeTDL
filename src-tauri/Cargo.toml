[package]
name = "hopetdl"
version = "0.3.0"
edition = "2021"
default-run = "hopetdl"

[lib]
name = "hopetdl_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:tauri-plugin-single-instance"]

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
chrono = "0.4"
regex = "1"
regress = "0.12"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
tauri = { version = "2", optional = true, features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
